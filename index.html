<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu Ôn Thi 10A1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-blue-50">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-600 mb-2">Kho Tài Liệu 10A1</h1>
                <p class="text-gray-500">Đăng nhập để xem và chia sẻ tài liệu</p>
            </div>
            
            <!-- KHÔNG CÓ BẤT KỲ DÒNG GỢI Ý TÀI KHOẢN NÀO Ở ĐÂY NỮA -->

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Tên đăng nhập</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required placeholder="Nhập tài khoản">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">Mật khẩu</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                    Đăng Nhập
                </button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH -->
    <div id="mainScreen" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
                <h1 class="text-xl font-bold text-blue-600 flex items-center">
                    <i class="fas fa-book-open mr-2"></i>Kho Tài Liệu 10A1
                </h1>
                <div class="flex items-center gap-3 flex-wrap">
                    <span id="userInfo" class="font-medium text-gray-700"></span>
                    <button id="btnManage" onclick="openManageModal()" class="hidden bg-purple-100 text-purple-700 px-3 py-1.5 rounded-md hover:bg-purple-200 text-sm font-semibold transition">
                        <i class="fas fa-users mr-1"></i>Quản lý user
                    </button>
                    <button onclick="logout()" class="text-red-500 hover:text-red-700 text-sm font-semibold px-2 py-1 transition">
                        <i class="fas fa-sign-out-alt mr-1"></i>Đăng xuất
                    </button>
                </div>
            </div>
        </header>

        <!-- Nội dung chính -->
        <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
            <div class="flex justify-between items-center mb-8 border-b pb-4">
                <h2 class="text-2xl font-bold text-gray-800">Tài liệu mới nhất</h2>
                <button onclick="openDocModal()" class="bg-green-500 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-green-600 shadow-md transition transform hover:-translate-y-0.5">
                    <i class="fas fa-plus mr-2"></i>Đăng bài
                </button>
            </div>

            <!-- Danh sách tài liệu -->
            <div id="documentList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Document Cards will be generated here -->
            </div>
        </main>
    </div>

    <!-- MODAL ĐĂNG TÀI LIỆU -->
    <div id="docModal" class="hidden fixed inset-0 modal-bg flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Đăng tài liệu mới</h3>
                <button onclick="closeDocModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-lg"></i></button>
            </div>
            <form onsubmit="handleAddDoc(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2 font-medium">Tên tài liệu / Môn học</label>
                    <input type="text" id="docTitle" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" required placeholder="VD: Đề cương Toán giữa kì 1">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2 font-medium">Link tài liệu (Drive, Mega...)</label>
                    <input type="url" id="docLink" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" required placeholder="https://...">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeDocModal()" class="px-5 py-2 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition">Hủy</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 shadow-md transition">Đăng bài</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL QUẢN LÝ TÀI KHOẢN -->
    <div id="manageModal" class="hidden fixed inset-0 modal-bg flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl p-6 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h3 class="text-xl font-bold text-gray-800">Quản lý Tài Khoản Lớp</h3>
                <button onclick="closeManageModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="bg-purple-50 p-5 rounded-lg mb-6 border border-purple-100">
                <h4 class="font-bold text-purple-800 mb-3"><i class="fas fa-user-plus mr-2"></i>Tạo tài khoản mới</h4>
                <form onsubmit="handleAddUser(event)" class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="newUsername" placeholder="Tên đăng nhập" class="px-3 py-2 border rounded-md focus:ring-2 focus:ring-purple-400 outline-none" required>
                    <input type="text" id="newPassword" placeholder="Mật khẩu" class="px-3 py-2 border rounded-md focus:ring-2 focus:ring-purple-400 outline-none" required>
                    <input type="text" id="newFullname" placeholder="Họ và tên thật" class="px-3 py-2 border rounded-md focus:ring-2 focus:ring-purple-400 outline-none" required>
                    <button type="submit" class="bg-purple-600 text-white py-2 px-4 rounded-md font-bold hover:bg-purple-700 transition shadow-sm">Thêm vào lớp</button>
                </form>
            </div>

            <h4 class="font-bold text-gray-700 mb-3">Danh sách tài khoản:</h4>
            <div class="overflow-y-auto flex-grow rounded-lg border">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-gray-100 shadow-sm">
                        <tr>
                            <th class="p-3 border-b text-gray-600">Họ Tên</th>
                            <th class="p-3 border-b text-gray-600">Tên đăng nhập</th>
                            <th class="p-3 border-b text-gray-600">Mật khẩu</th>
                            <th class="p-3 border-b text-center text-gray-600">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="userListTable" class="divide-y divide-gray-200">
                        <!-- Users will be listed here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình LocalStorage
        const USERS_KEY = '10a1_users_v2'; 
        const DOCS_KEY = '10a1_docs_v2';
        let currentUser = null;

        // TỰ ĐỘNG TẠO TÀI KHOẢN ADMIN KHI MỞ TRANG
        function initAdmin() {
            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            // Nếu chưa có ai tên là admin thì tạo mới
            if (!users.find(u => u.username === 'admin')) {
                users.push({ 
                    username: 'admin', 
                    password: '123456', 
                    fullName: 'Lớp Trưởng', 
                    role: 'admin' 
                });
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            }
        }
        initAdmin(); // Gọi ngay lập tức

        // Các hàm Ẩn/Hiện giao diện
        function show(id) { document.getElementById(id).classList.remove('hidden'); }
        function hide(id) { document.getElementById(id).classList.add('hidden'); }

        // ĐĂNG NHẬP
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            
            // Lấy danh sách từ bộ nhớ
            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            
            // Tìm tài khoản khớp
            const validUser = users.find(user => user.username === u && user.password === p);

            if (validUser) {
                currentUser = validUser;
                document.getElementById('userInfo').innerHTML = `Chào, <b>${currentUser.fullName}</b>`;
                
                if (currentUser.role === 'admin') {
                    show('btnManage');
                } else {
                    hide('btnManage');
                }

                hide('loginScreen');
                show('mainScreen');
                renderDocs();
                document.getElementById('loginForm').reset();
            } else {
                alert('Sai tên đăng nhập hoặc mật khẩu! Vui lòng thử lại.');
            }
        }

        // ĐĂNG XUẤT
        function logout() {
            currentUser = null;
            hide('mainScreen');
            show('loginScreen');
        }

        // --- PHẦN TÀI LIỆU ---
        function openDocModal() { show('docModal'); }
        function closeDocModal() { 
            hide('docModal'); 
            document.getElementById('docTitle').value = ''; 
            document.getElementById('docLink').value = ''; 
        }

        function handleAddDoc(e) {
            e.preventDefault();
            const title = document.getElementById('docTitle').value;
            const link = document.getElementById('docLink').value;
            
            // Lấy ngày giờ hiện tại chính xác
            const now = new Date();
            const dateStr = now.toLocaleDateString('vi-VN') + ' - ' + now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});

            let docs = JSON.parse(localStorage.getItem(DOCS_KEY)) || [];
            docs.unshift({ 
                id: Date.now(), 
                title: title, 
                link: link, 
                author: currentUser.fullName, 
                date: dateStr 
            });
            localStorage.setItem(DOCS_KEY, JSON.stringify(docs));
            
            closeDocModal();
            renderDocs();
        }

        function deleteDoc(id) {
            if(confirm('Bạn có chắc chắn muốn xóa tài liệu này?')) {
                let docs = JSON.parse(localStorage.getItem(DOCS_KEY)) || [];
                docs = docs.filter(d => d.id !== id);
                localStorage.setItem(DOCS_KEY, JSON.stringify(docs));
                renderDocs();
            }
        }

        function renderDocs() {
            const list = document.getElementById('documentList');
            let docs = JSON.parse(localStorage.getItem(DOCS_KEY)) || [];
            
            if (docs.length === 0) {
                list.innerHTML = `<div class="col-span-full bg-white p-8 rounded-xl border text-center shadow-sm">
                    <i class="fas fa-folder-open text-4xl text-gray-300 mb-3"></i>
                    <p class="text-gray-500">Chưa có tài liệu nào. Hãy bấm "Đăng bài" để đóng góp nhé!</p>
                </div>`;
                return;
            }

            list.innerHTML = docs.map(doc => `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition group">
                    <div class="flex items-start justify-between mb-4">
                        <h3 class="font-bold text-lg text-gray-800 leading-tight pr-2">${doc.title}</h3>
                        <div class="bg-blue-50 p-2 rounded-lg text-blue-500">
                            <i class="fas fa-file-alt text-xl"></i>
                        </div>
                    </div>
                    <div class="text-sm text-gray-500 mb-5 space-y-1 bg-gray-50 p-3 rounded-lg border border-dashed">
                        <p class="flex items-center"><i class="fas fa-user-edit w-5 text-gray-400"></i> Đăng bởi: <span class="font-semibold text-gray-700 ml-1">${doc.author}</span></p>
                        <p class="flex items-center"><i class="fas fa-clock w-5 text-gray-400"></i> ${doc.date}</p>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t">
                        <a href="${doc.link}" target="_blank" class="text-blue-600 font-semibold hover:text-blue-800 flex items-center transition">
                            <i class="fas fa-external-link-alt mr-2"></i>Mở tài liệu
                        </a>
                        ${(currentUser && (currentUser.fullName === doc.author || currentUser.role === 'admin')) 
                            ? `<button onclick="deleteDoc(${doc.id})" class="text-gray-400 hover:text-red-500 transition px-2 py-1" title="Xóa tài liệu">
                                <i class="fas fa-trash-alt"></i>
                               </button>` 
                            : ''}
                    </div>
                </div>
            `).join('');
        }

        // --- PHẦN QUẢN LÝ TÀI KHOẢN ---
        function openManageModal() { show('manageModal'); renderUsers(); }
        function closeManageModal() { hide('manageModal'); }

        function handleAddUser(e) {
            e.preventDefault();
            const u = document.getElementById('newUsername').value.trim();
            const p = document.getElementById('newPassword').value.trim();
            const fn = document.getElementById('newFullname').value.trim();

            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            if(users.find(user => user.username === u)) {
                alert('Tên đăng nhập này đã tồn tại, vui lòng chọn tên khác!');
                return;
            }

            users.push({ username: u, password: p, fullName: fn, role: 'student' });
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('newFullname').value = '';
            renderUsers();
            
            alert(`Đã thêm thành công bạn: ${fn}`);
        }

        function deleteUser(username) {
            if(username === 'admin') {
                alert('Bạn không thể xóa tài khoản Quản trị viên!');
                return;
            }
            if(confirm(`Bạn có chắc chắn muốn xóa tài khoản "${username}" không?`)) {
                let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
                users = users.filter(u => u.username !== username);
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                renderUsers();
            }
        }

        function renderUsers() {
            const tbody = document.getElementById('userListTable');
            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            
            tbody.innerHTML = users.map(u => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-3 text-gray-800 font-medium">
                        ${u.fullName} 
                        ${u.role === 'admin' ? '<span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full ml-2 font-bold">Admin</span>' : ''}
                    </td>
                    <td class="p-3 font-mono text-gray-600">${u.username}</td>
                    <td class="p-3 font-mono text-gray-600">${u.password}</td>
                    <td class="p-3 text-center">
                        ${u.role !== 'admin' 
                            ? `<button onclick="deleteUser('${u.username}')" class="text-red-400 hover:text-red-600 p-1 bg-red-50 rounded hover:bg-red-100 transition"><i class="fas fa-trash"></i></button>` 
                            : '<span class="text-gray-300"><i class="fas fa-lock"></i></span>'}
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
