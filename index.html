<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu Ôn Thi 10A1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-blue-50">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-blue-600">Kho Tài Liệu 10A1</h1>
                <p class="text-gray-500 mt-2">Đăng nhập để xem và chia sẻ tài liệu</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Tên đăng nhập</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">Mật khẩu</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                    Đăng Nhập
                </button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH -->
    <div id="mainScreen" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-blue-600"><i class="fas fa-book-open mr-2"></i>Kho Tài Liệu 10A1</h1>
                <div class="flex items-center gap-4">
                    <span id="userInfo" class="font-medium text-gray-700"></span>
                    <button id="btnManage" onclick="openManageModal()" class="hidden bg-purple-100 text-purple-700 px-3 py-1 rounded-md hover:bg-purple-200 text-sm font-semibold">
                        <i class="fas fa-users mr-1"></i>Quản lý user
                    </button>
                    <button onclick="logout()" class="text-red-500 hover:text-red-700 text-sm font-semibold">
                        <i class="fas fa-sign-out-alt mr-1"></i>Đăng xuất
                    </button>
                </div>
            </div>
        </header>

        <!-- Nút thêm tài liệu -->
        <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Tài liệu mới nhất</h2>
                <button onclick="openDocModal()" class="bg-green-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-600 shadow-sm">
                    <i class="fas fa-plus mr-2"></i>Đăng tài liệu
                </button>
            </div>

            <!-- Danh sách tài liệu -->
            <div id="documentList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Document Cards will be generated here -->
            </div>
        </main>
    </div>

    <!-- MODAL ĐĂNG TÀI LIỆU -->
    <div id="docModal" class="hidden fixed inset-0 modal-bg flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4">Đăng tài liệu mới</h3>
            <form onsubmit="handleAddDoc(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-1">Tên tài liệu / Môn học</label>
                    <input type="text" id="docTitle" class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500" required placeholder="VD: Đề cương Toán giữa kì 1">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-1">Link tài liệu (Drive, Mega...)</label>
                    <input type="url" id="docLink" class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500" required placeholder="https://...">
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeDocModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Đăng bài</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL QUẢN LÝ TÀI KHOẢN -->
    <div id="manageModal" class="hidden fixed inset-0 modal-bg flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Quản lý Tài Khoản Lớp</h3>
                <button onclick="closeManageModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="bg-gray-50 p-4 rounded-lg mb-6">
                <h4 class="font-bold mb-2">Tạo tài khoản mới</h4>
                <form onsubmit="handleAddUser(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="newUsername" placeholder="Tên đăng nhập" class="px-3 py-2 border rounded" required>
                    <input type="text" id="newPassword" placeholder="Mật khẩu" class="px-3 py-2 border rounded" required>
                    <input type="text" id="newFullname" placeholder="Họ và tên thật" class="px-3 py-2 border rounded" required>
                    <button type="submit" class="md:col-span-3 bg-purple-600 text-white py-2 rounded font-bold hover:bg-purple-700">Thêm vào lớp</button>
                </form>
            </div>

            <h4 class="font-bold mb-2">Danh sách tài khoản:</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="p-2 border">Họ Tên</th>
                            <th class="p-2 border">Tên đăng nhập</th>
                            <th class="p-2 border">Mật khẩu</th>
                            <th class="p-2 border">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="userListTable">
                        <!-- Users will be listed here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo dữ liệu
        const USERS_KEY = '10a1_users';
        const DOCS_KEY = '10a1_docs';
        let currentUser = null;

        // Đảm bảo LUÔN có tài khoản admin ẩn
        function initAdmin() {
            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            if (!users.find(u => u.username === 'admin')) {
                users.push({ username: 'admin', password: '123456', fullName: 'Lớp Trưởng / Admin', role: 'admin' });
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            }
        }
        initAdmin(); // Gọi ngay khi load trang

        // Các hàm xử lý giao diện
        function show(id) { document.getElementById(id).classList.remove('hidden'); }
        function hide(id) { document.getElementById(id).classList.add('hidden'); }

        // LOGIC ĐĂNG NHẬP
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            
            // Xóa cứng logic kiểm tra, ngầm định đọc từ localStorage (đã có admin)
            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            const validUser = users.find(user => user.username === u && user.password === p);

            if (validUser) {
                currentUser = validUser;
                document.getElementById('userInfo').innerHTML = `Chào, <b>${currentUser.fullName}</b>`;
                
                if (currentUser.role === 'admin') {
                    show('btnManage');
                } else {
                    hide('btnManage');
                }

                hide('loginScreen');
                show('mainScreen');
                renderDocs();
                document.getElementById('loginForm').reset();
            } else {
                alert('Sai tên đăng nhập hoặc mật khẩu! Vui lòng thử lại.');
            }
        }

        function logout() {
            currentUser = null;
            hide('mainScreen');
            show('loginScreen');
        }

        // LOGIC TÀI LIỆU
        function openDocModal() { show('docModal'); }
        function closeDocModal() { hide('docModal'); document.getElementById('docTitle').value = ''; document.getElementById('docLink').value = ''; }

        function handleAddDoc(e) {
            e.preventDefault();
            const title = document.getElementById('docTitle').value;
            const link = document.getElementById('docLink').value;
            const date = new Date().toLocaleDateString('vi-VN');

            let docs = JSON.parse(localStorage.getItem(DOCS_KEY)) || [];
            docs.unshift({ id: Date.now(), title, link, author: currentUser.fullName, date });
            localStorage.setItem(DOCS_KEY, JSON.stringify(docs));
            
            closeDocModal();
            renderDocs();
        }

        function deleteDoc(id) {
            if(confirm('Bạn có chắc chắn muốn xóa tài liệu này?')) {
                let docs = JSON.parse(localStorage.getItem(DOCS_KEY)) || [];
                docs = docs.filter(d => d.id !== id);
                localStorage.setItem(DOCS_KEY, JSON.stringify(docs));
                renderDocs();
            }
        }

        function renderDocs() {
            const list = document.getElementById('documentList');
            let docs = JSON.parse(localStorage.getItem(DOCS_KEY)) || [];
            
            if (docs.length === 0) {
                list.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">Chưa có tài liệu nào. Hãy là người đầu tiên đóng góp nhé!</p>`;
                return;
            }

            list.innerHTML = docs.map(doc => `
                <div class="bg-white p-5 rounded-xl shadow border border-gray-100 hover:shadow-md transition">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="font-bold text-lg text-gray-800 leading-tight">${doc.title}</h3>
                        <i class="fas fa-file-alt text-blue-500 text-2xl"></i>
                    </div>
                    <div class="text-sm text-gray-500 mb-4">
                        <p><i class="fas fa-user-edit w-4"></i> Đăng bởi: <span class="font-medium text-gray-700">${doc.author}</span></p>
                        <p><i class="fas fa-calendar-alt w-4"></i> Ngày: ${doc.date}</p>
                    </div>
                    <div class="flex justify-between items-center mt-4">
                        <a href="${doc.link}" target="_blank" class="text-blue-600 font-semibold hover:underline">
                            <i class="fas fa-download mr-1"></i>Xem/Tải file
                        </a>
                        ${(currentUser && (currentUser.fullName === doc.author || currentUser.role === 'admin')) 
                            ? `<button onclick="deleteDoc(${doc.id})" class="text-red-400 hover:text-red-600" title="Xóa tài liệu"><i class="fas fa-trash"></i></button>` 
                            : ''}
                    </div>
                </div>
            `).join('');
        }

        // LOGIC QUẢN LÝ TÀI KHOẢN (Chỉ Admin)
        function openManageModal() { show('manageModal'); renderUsers(); }
        function closeManageModal() { hide('manageModal'); }

        function handleAddUser(e) {
            e.preventDefault();
            const u = document.getElementById('newUsername').value.trim();
            const p = document.getElementById('newPassword').value.trim();
            const fn = document.getElementById('newFullname').value.trim();

            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            if(users.find(user => user.username === u)) {
                alert('Tên đăng nhập này đã tồn tại!');
                return;
            }

            users.push({ username: u, password: p, fullName: fn, role: 'student' });
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('newFullname').value = '';
            renderUsers();
        }

        function deleteUser(username) {
            if(username === 'admin') {
                alert('Không thể xóa tài khoản Quản trị viên gốc!');
                return;
            }
            if(confirm(`Xóa tài khoản ${username}?`)) {
                let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
                users = users.filter(u => u.username !== username);
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                renderUsers();
            }
        }

        function renderUsers() {
            const tbody = document.getElementById('userListTable');
            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            
            tbody.innerHTML = users.map(u => `
                <tr class="border-b">
                    <td class="p-2">${u.fullName} ${u.role === 'admin' ? '<span class="text-xs bg-red-100 text-red-600 px-1 rounded ml-1">Admin</span>' : ''}</td>
                    <td class="p-2 font-mono">${u.username}</td>
                    <td class="p-2 font-mono">${u.password}</td>
                    <td class="p-2 text-center">
                        ${u.role !== 'admin' ? `<button onclick="deleteUser('${u.username}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>` : ''}
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
